name: Publish GitHub Package Smoke Fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-smoke-fixture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@sthenos-security"

      - name: Publish smoke fixture
        working-directory: packages/reach-ghpkg-smoke-fixture
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
