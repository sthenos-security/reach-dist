name: Installer Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check installer
        run: bash -n install.sh

      - name: Resolve local manifest smoke
        run: bash ./test-install-manifest.sh

      - name: Trust-root smoke
        run: bash ./test-installer-trust-root.sh

      - name: Bootstrap recomputes the root fingerprint (forged key list refused)
        run: bash ./test-installer-bootstrap-root-fingerprint.sh

      - name: Air-gap bundle mode (extraction, root, version, wheel source)
        run: bash ./test-installer-bundle-mode.sh

      - name: Constraints signature smoke
        run: bash ./test-installer-constraints-signature.sh

      # --update must never delete a venv it cannot judge (b231..b243 did,
      # on every Linux host), and the daemon must be stopped before the
      # runtime under it is removed.
      - name: Venv probe keeps a healthy venv and aborts on an unregistered package
        run: bash ./test-installer-venv-probe.sh

      - name: Daemon is stopped before every runtime removal
        run: bash ./test-installer-daemon-stop.sh

      - name: A workspace that could not be wired is exit 1, never "success"
        run: bash ./test-installer-vibe-setup-exit.sh

      - name: install.sh does not pass --ci to wire-workspace (CI never skips security)
        run: bash ./test-installer-no-ci-on-wire.sh

      - name: A guard hold names the finding on the plugin path
        run: bash ./test-installer-vibe-setup-held.sh

      - name: No GitHub token in any process argv
        run: bash ./test-installer-no-token-in-argv.sh

      - name: One version source (first-party manifest), bounded metadata requests
        run: bash ./test-installer-version-source.sh

      - name: doctor, selftest and wire-workspace are bounded; a failed selftest fails the install
        run: bash ./test-installer-bounded-runtime.sh

      - name: The install summary detects no CI
        run: bash ./test-installer-summary-no-ci.sh

      - name: A pointer-resolved version needs the release's signed current-release statement
        run: bash ./test-installer-current-release-statement.sh

      # Python 3.11 ships pip 24.0, the oldest pip a supported CPython
      # (3.11-3.14) brings. An air-gap install cannot upgrade pip, so the
      # installer must work with it (b236 did not).
      - name: Set up the oldest supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Signature verifier installs offline with the oldest pip
        run: PYTHON=python3.11 bash ./test-installer-verifier-oldest-pip.sh
