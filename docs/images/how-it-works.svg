<svg width="100%" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
<title>REACHABLE - How it works</title>
<desc>High-level REACHABLE workflow: inventory, discovery, reachability, exposure validation, and remediation.</desc>

<style>
  @media (prefers-color-scheme: light) {
    :root {
      --text-primary: #111827; --text-secondary: #667085; --muted: #8792A2;
      --border: rgba(15,23,42,0.14); --connector: #667085; --feedback: #8B5CF6;
      --scan-fill: #E6FAF4; --scan-stroke: #0F766E; --scan-title: #115E59; --scan-sub: #0F766E;
      --ai-fill: #EEF2FF; --ai-stroke: #6366F1; --ai-title: #4338CA; --ai-sub: #6366F1;
      --fix-fill: #FFF3E8; --fix-stroke: #EA580C; --fix-title: #9A3412; --fix-sub: #EA580C;
      --chip-fill: #F8FAFC; --chip-stroke: #CBD5E1; --chip-title: #334155;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #F3F7FF; --text-secondary: #A9B3C3; --muted: #7E8899;
      --border: rgba(255,255,255,0.13); --connector: #8490A3; --feedback: #B084F5;
      --scan-fill: #062F2D; --scan-stroke: #5EEAD4; --scan-title: #B6F7E5; --scan-sub: #74F0D8;
      --ai-fill: #1E1B4B; --ai-stroke: #A5B4FC; --ai-title: #D8DDFE; --ai-sub: #B7C2FD;
      --fix-fill: #431407; --fix-stroke: #FDBA74; --fix-title: #FFE0BF; --fix-sub: #FDBA74;
      --chip-fill: #131A25; --chip-stroke: #657386; --chip-title: #E5EAF3;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .headline { font-size: 25px; font-weight: 760; letter-spacing: 0.01em; }
  .subtitle { font-size: 13px; font-weight: 470; }
  .step { font-size: 10px; font-weight: 750; letter-spacing: 0.12em; }
  .card-title { font-size: 16px; font-weight: 720; }
  .card-sub { font-size: 12px; font-weight: 500; }
  .chip { font-size: 13px; font-weight: 680; }
  .loop { font-size: 11.5px; font-weight: 500; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
  </filter>
</defs>

<text class="headline" x="380" y="38" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">AI-assisted Risk Exposure Reduction</text>
<text class="subtitle" x="380" y="65" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)">Deterministic validation, bounded AI reasoning, and agentic remediation</text>

<line x1="104" y1="163" x2="666" y2="163" stroke="var(--connector)" stroke-width="1" opacity="0.28"/>

<rect x="30" y="112" width="124" height="94" rx="14" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.8" filter="url(#softShadow)"/>
<text class="step" x="92" y="134" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">01</text>
<text class="card-title" x="92" y="164" text-anchor="middle" dominant-baseline="central" fill="var(--scan-title)">Inventory</text>
<text class="card-sub" x="92" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">map assets</text>

<line x1="154" y1="163" x2="168" y2="163" stroke="var(--connector)" stroke-width="1.1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="174" y="112" width="124" height="94" rx="14" fill="var(--ai-fill)" stroke="var(--ai-stroke)" stroke-width="0.8" filter="url(#softShadow)"/>
<text class="step" x="236" y="134" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">02</text>
<text class="card-title" x="236" y="164" text-anchor="middle" dominant-baseline="central" fill="var(--ai-title)">Discovery</text>
<text class="card-sub" x="236" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">find signals</text>

<line x1="298" y1="163" x2="312" y2="163" stroke="var(--connector)" stroke-width="1.1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="318" y="112" width="124" height="94" rx="14" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.8" filter="url(#softShadow)"/>
<text class="step" x="380" y="134" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">03</text>
<text class="card-title" x="380" y="164" text-anchor="middle" dominant-baseline="central" fill="var(--scan-title)">Reachability</text>
<text class="card-sub" x="380" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">prove paths</text>

<line x1="442" y1="163" x2="456" y2="163" stroke="var(--connector)" stroke-width="1.1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="462" y="112" width="124" height="94" rx="14" fill="var(--ai-fill)" stroke="var(--ai-stroke)" stroke-width="0.8" filter="url(#softShadow)"/>
<text class="step" x="524" y="134" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">04</text>
<text class="card-title" x="524" y="164" text-anchor="middle" dominant-baseline="central" fill="var(--ai-title)">Exposure</text>
<text class="card-sub" x="524" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">validate risk</text>

<line x1="586" y1="163" x2="600" y2="163" stroke="var(--connector)" stroke-width="1.1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="606" y="112" width="124" height="94" rx="14" fill="var(--fix-fill)" stroke="var(--fix-stroke)" stroke-width="0.8" filter="url(#softShadow)"/>
<text class="step" x="668" y="134" text-anchor="middle" dominant-baseline="central" fill="var(--fix-sub)">05</text>
<text class="card-title" x="668" y="164" text-anchor="middle" dominant-baseline="central" fill="var(--fix-title)">Remediation</text>
<text class="card-sub" x="668" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--fix-sub)">fix first</text>

<path d="M668 221 C668 265 92 265 92 221" fill="none" stroke="var(--feedback)" stroke-width="1.1" stroke-dasharray="6 6" marker-end="url(#arrow)" opacity="0.58"/>
<text class="loop" x="380" y="252" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)">continuous feedback before the next change ships</text>

<line x1="90" y1="281" x2="670" y2="281" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="5 6"/>

<rect x="120" y="299" width="150" height="34" rx="10" fill="var(--chip-fill)" stroke="var(--chip-stroke)" stroke-width="0.8"/>
<text class="chip" x="195" y="316" text-anchor="middle" dominant-baseline="central" fill="var(--chip-title)">Reduce noise</text>

<rect x="305" y="299" width="150" height="34" rx="10" fill="var(--chip-fill)" stroke="var(--chip-stroke)" stroke-width="0.8"/>
<text class="chip" x="380" y="316" text-anchor="middle" dominant-baseline="central" fill="var(--chip-title)">Prioritize fixes</text>

<rect x="490" y="299" width="150" height="34" rx="10" fill="var(--chip-fill)" stroke="var(--chip-stroke)" stroke-width="0.8"/>
<text class="chip" x="565" y="316" text-anchor="middle" dominant-baseline="central" fill="var(--chip-title)">Prove outcomes</text>

</svg>
