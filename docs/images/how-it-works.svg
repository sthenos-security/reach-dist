<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<title>Reachable — How it works</title>
<desc>Simplified architecture: deterministic scan pipeline with AI reasoning layer</desc>

<style>
  @media (prefers-color-scheme: light) {
    :root {
      --text-primary: #1A1A1A; --text-secondary: #6B6A65; --border: rgba(0,0,0,0.15);
      --teal-fill: #E1F5EE; --teal-stroke: #0F6E56; --teal-title: #085041; --teal-sub: #0F6E56;
      --purple-fill: #EEEDFE; --purple-stroke: #534AB7; --purple-title: #3C3489; --purple-sub: #534AB7;
      --gray-fill: #F1EFE8; --gray-stroke: #5F5E5A; --gray-title: #444441; --gray-sub: #5F5E5A;
      --connector: #7F77DD;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #E8E6DF; --text-secondary: #9C9A92; --border: rgba(255,255,255,0.15);
      --teal-fill: #085041; --teal-stroke: #5DCAA5; --teal-title: #9FE1CB; --teal-sub: #5DCAA5;
      --purple-fill: #26215C; --purple-stroke: #AFA9EC; --purple-title: #CECBF6; --purple-sub: #AFA9EC;
      --gray-fill: #2C2C2A; --gray-stroke: #B4B2A9; --gray-title: #D3D1C7; --gray-sub: #B4B2A9;
      --connector: #AFA9EC;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===== INPUT ===== -->
<rect x="40" y="40" width="100" height="50" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="th" x="90" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--gray-title)">Your code</text>
<text class="ts" x="90" y="74" text-anchor="middle" dominant-baseline="central" fill="var(--gray-sub)">+ dependencies</text>

<line x1="140" y1="65" x2="168" y2="65" stroke="var(--teal-stroke)" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ===== PIPELINE ===== -->
<rect x="174" y="40" width="120" height="50" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
<text class="th" x="234" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--teal-title)">Scan</text>
<text class="ts" x="234" y="74" text-anchor="middle" dominant-baseline="central" fill="var(--teal-sub)">6 scanner types</text>

<line x1="294" y1="65" x2="318" y2="65" stroke="var(--teal-stroke)" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="324" y="40" width="120" height="50" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
<text class="th" x="384" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--teal-title)">Classify</text>
<text class="ts" x="384" y="74" text-anchor="middle" dominant-baseline="central" fill="var(--teal-sub)">Reachability proof</text>

<line x1="444" y1="65" x2="468" y2="65" stroke="var(--teal-stroke)" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="474" y="40" width="120" height="50" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
<text class="th" x="534" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--teal-title)">Correlate</text>
<text class="ts" x="534" y="74" text-anchor="middle" dominant-baseline="central" fill="var(--teal-sub)">Cross-signal links</text>

<line x1="594" y1="65" x2="618" y2="65" stroke="var(--gray-stroke)" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="624" y="45" width="40" height="40" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="644" y="65" text-anchor="middle" dominant-baseline="central" fill="var(--gray-title)">Report</text>

<!-- ===== BIDIRECTIONAL CONNECTORS ===== -->
<line x1="310" y1="90" x2="310" y2="130" stroke="var(--connector)" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.45"/>
<line x1="460" y1="90" x2="460" y2="130" stroke="var(--connector)" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.45"/>
<line x1="296" y1="130" x2="296" y2="90" stroke="var(--connector)" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.25"/>
<line x1="446" y1="130" x2="446" y2="90" stroke="var(--connector)" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.25"/>

<!-- ===== REASONING ENGINE ===== -->
<rect x="174" y="132" width="420" height="46" rx="10" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
<text class="th" x="384" y="148" text-anchor="middle" dominant-baseline="central" fill="var(--purple-title)">Reasoning engine</text>
<text class="ts" x="384" y="165" text-anchor="middle" dominant-baseline="central" fill="var(--purple-sub)">Multiple AI agents — every decision audited</text>

<!-- Dashed lines to agents -->
<line x1="290" y1="178" x2="290" y2="208" stroke="var(--connector)" stroke-width="0.8" opacity="0.35" stroke-dasharray="3 3"/>
<line x1="480" y1="178" x2="480" y2="208" stroke="var(--connector)" stroke-width="0.8" opacity="0.35" stroke-dasharray="3 3"/>

<!-- ===== AGENTS ===== -->
<rect x="174" y="210" width="200" height="56" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
<text class="th" x="274" y="230" text-anchor="middle" dominant-baseline="central" fill="var(--purple-title)">Reachability analysis</text>
<text class="ts" x="274" y="248" text-anchor="middle" dominant-baseline="central" fill="var(--purple-sub)">Can an attacker reach this?</text>

<rect x="394" y="210" width="200" height="56" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
<text class="th" x="494" y="230" text-anchor="middle" dominant-baseline="central" fill="var(--purple-title)">Remediation</text>
<text class="ts" x="494" y="248" text-anchor="middle" dominant-baseline="central" fill="var(--purple-sub)">How do I fix this?</text>

<!-- ===== OUTCOMES ===== -->
<line x1="40" y1="296" x2="640" y2="296" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect x="40" y="316" width="185" height="50" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="th" x="132" y="334" text-anchor="middle" dominant-baseline="central" fill="var(--gray-title)">64% noise eliminated</text>
<text class="ts" x="132" y="350" text-anchor="middle" dominant-baseline="central" fill="var(--gray-sub)">Before any AI runs</text>

<rect x="247" y="316" width="185" height="50" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central" fill="var(--gray-title)">Full audit trail</text>
<text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="var(--gray-sub)">Every decision provable</text>

<rect x="454" y="316" width="185" height="50" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="th" x="547" y="334" text-anchor="middle" dominant-baseline="central" fill="var(--gray-title)">Sub-$1 per scan</text>
<text class="ts" x="547" y="350" text-anchor="middle" dominant-baseline="central" fill="var(--gray-sub)">AI cost controlled</text>

<!-- ===== LEGEND ===== -->
<rect x="40" y="388" width="10" height="10" rx="2" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
<text class="ts" x="56" y="398" fill="var(--text-secondary)">Deterministic</text>
<rect x="150" y="388" width="10" height="10" rx="2" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
<text class="ts" x="166" y="398" fill="var(--text-secondary)">AI reasoning</text>
<rect x="260" y="388" width="10" height="10" rx="2" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.5"/>
<text class="ts" x="276" y="398" fill="var(--text-secondary)">Outcomes</text>

</svg>
