<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<title>REACHABLE - How it works</title>
<desc>High-level REACHABLE workflow: inventory, discovery, reachability, exposure validation, and remediation.</desc>

<style>
  @media (prefers-color-scheme: light) {
    :root {
      --text-primary: #1A1A1A; --text-secondary: #666C75; --border: rgba(0,0,0,0.14);
      --input-fill: #F3F5F7; --input-stroke: #64748B; --input-title: #334155; --input-sub: #64748B;
      --scan-fill: #E2F8F0; --scan-stroke: #0F766E; --scan-title: #115E59; --scan-sub: #0F766E;
      --ai-fill: #EEF2FF; --ai-stroke: #6366F1; --ai-title: #4338CA; --ai-sub: #6366F1;
      --fix-fill: #FFF7ED; --fix-stroke: #EA580C; --fix-title: #9A3412; --fix-sub: #EA580C;
      --out-fill: #F8FAFC; --out-stroke: #64748B; --out-title: #334155; --out-sub: #64748B;
      --connector: #64748B; --feedback: #A855F7;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #E8EEF8; --text-secondary: #9AA4B2; --border: rgba(255,255,255,0.13);
      --input-fill: #111827; --input-stroke: #64748B; --input-title: #E2E8F0; --input-sub: #94A3B8;
      --scan-fill: #062F2D; --scan-stroke: #5EEAD4; --scan-title: #A7F3D0; --scan-sub: #5EEAD4;
      --ai-fill: #1E1B4B; --ai-stroke: #A5B4FC; --ai-title: #C7D2FE; --ai-sub: #A5B4FC;
      --fix-fill: #431407; --fix-stroke: #FDBA74; --fix-title: #FED7AA; --fix-sub: #FDBA74;
      --out-fill: #161B22; --out-stroke: #94A3B8; --out-title: #E2E8F0; --out-sub: #94A3B8;
      --connector: #94A3B8; --feedback: #C084FC;
    }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size: 14px; font-weight: 650; }
  .sub { font-size: 11.5px; font-weight: 450; }
  .eyebrow { font-size: 10px; font-weight: 650; letter-spacing: 0.08em; }
  .small { font-size: 10.5px; font-weight: 450; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Input and output -->
<rect x="34" y="44" width="118" height="58" rx="10" fill="var(--input-fill)" stroke="var(--input-stroke)" stroke-width="0.7"/>
<text class="title" x="93" y="65" text-anchor="middle" dominant-baseline="central" fill="var(--input-title)">Codebase</text>
<text class="sub" x="93" y="83" text-anchor="middle" dominant-baseline="central" fill="var(--input-sub)">code + dependencies</text>

<rect x="528" y="44" width="118" height="58" rx="10" fill="var(--out-fill)" stroke="var(--out-stroke)" stroke-width="0.7"/>
<text class="title" x="587" y="65" text-anchor="middle" dominant-baseline="central" fill="var(--out-title)">Evidence</text>
<text class="sub" x="587" y="83" text-anchor="middle" dominant-baseline="central" fill="var(--out-sub)">dashboard + CI</text>

<line x1="152" y1="73" x2="199" y2="73" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.72"/>
<line x1="481" y1="73" x2="528" y2="73" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.72"/>

<rect x="206" y="38" width="268" height="70" rx="12" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">LOCAL-FIRST RISK EXPOSURE REDUCTION</text>
<text class="title" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="var(--scan-title)">One workflow for AI-DLC and SDLC</text>
<text class="sub" x="340" y="94" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">validate exposure, reduce exploitable risk</text>

<!-- Five-stage flow -->
<line x1="72" y1="194" x2="604" y2="194" stroke="var(--connector)" stroke-width="1" opacity="0.35"/>

<rect x="36" y="142" width="112" height="92" rx="12" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="92" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">01</text>
<text class="title" x="92" y="184" text-anchor="middle" dominant-baseline="central" fill="var(--scan-title)">Inventory</text>
<text class="sub" x="92" y="207" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">map code, packages,</text>
<text class="sub" x="92" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">APIs, and signals</text>

<line x1="148" y1="194" x2="164" y2="194" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="170" y="142" width="112" height="92" rx="12" fill="var(--ai-fill)" stroke="var(--ai-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="226" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">02</text>
<text class="title" x="226" y="184" text-anchor="middle" dominant-baseline="central" fill="var(--ai-title)">Discovery</text>
<text class="sub" x="226" y="207" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">find CVE, CWE,</text>
<text class="sub" x="226" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">AI, DLP, secrets</text>

<line x1="282" y1="194" x2="298" y2="194" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="304" y="142" width="112" height="92" rx="12" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="360" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">03</text>
<text class="title" x="360" y="184" text-anchor="middle" dominant-baseline="central" fill="var(--scan-title)">Reachability</text>
<text class="sub" x="360" y="207" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">prove executable</text>
<text class="sub" x="360" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--scan-sub)">paths in context</text>

<line x1="416" y1="194" x2="432" y2="194" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="438" y="142" width="112" height="92" rx="12" fill="var(--ai-fill)" stroke="var(--ai-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="494" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">04</text>
<text class="title" x="494" y="184" text-anchor="middle" dominant-baseline="central" fill="var(--ai-title)">Exposure</text>
<text class="sub" x="494" y="207" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">validate attackable,</text>
<text class="sub" x="494" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--ai-sub)">defended, uncertain</text>

<line x1="550" y1="194" x2="566" y2="194" stroke="var(--connector)" stroke-width="1" marker-end="url(#arrow)" opacity="0.78"/>

<rect x="572" y="142" width="112" height="92" rx="12" fill="var(--fix-fill)" stroke="var(--fix-stroke)" stroke-width="0.7"/>
<text class="eyebrow" x="628" y="160" text-anchor="middle" dominant-baseline="central" fill="var(--fix-sub)">05</text>
<text class="title" x="628" y="184" text-anchor="middle" dominant-baseline="central" fill="var(--fix-title)">Remediation</text>
<text class="sub" x="628" y="207" text-anchor="middle" dominant-baseline="central" fill="var(--fix-sub)">agent or CI fixes</text>
<text class="sub" x="628" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--fix-sub)">with proof</text>

<!-- Feedback loop -->
<path d="M628 242 C628 282 94 282 94 242" fill="none" stroke="var(--feedback)" stroke-width="1" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity="0.58"/>
<text class="small" x="340" y="270" text-anchor="middle" dominant-baseline="central" fill="var(--text-secondary)">AI-DLC loop: validation feedback updates the coding workflow before the next change ships</text>

<!-- Outcomes -->
<line x1="40" y1="302" x2="640" y2="302" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="4 4"/>

<rect x="40" y="322" width="185" height="48" rx="9" fill="var(--out-fill)" stroke="var(--out-stroke)" stroke-width="0.7"/>
<text class="title" x="132" y="340" text-anchor="middle" dominant-baseline="central" fill="var(--out-title)">Less noise</text>
<text class="sub" x="132" y="356" text-anchor="middle" dominant-baseline="central" fill="var(--out-sub)">prioritize reachable exposure</text>

<rect x="247" y="322" width="185" height="48" rx="9" fill="var(--out-fill)" stroke="var(--out-stroke)" stroke-width="0.7"/>
<text class="title" x="340" y="340" text-anchor="middle" dominant-baseline="central" fill="var(--out-title)">Clear priority</text>
<text class="sub" x="340" y="356" text-anchor="middle" dominant-baseline="central" fill="var(--out-sub)">fix attackable paths first</text>

<rect x="454" y="322" width="185" height="48" rx="9" fill="var(--out-fill)" stroke="var(--out-stroke)" stroke-width="0.7"/>
<text class="title" x="547" y="340" text-anchor="middle" dominant-baseline="central" fill="var(--out-title)">Audit-ready proof</text>
<text class="sub" x="547" y="356" text-anchor="middle" dominant-baseline="central" fill="var(--out-sub)">evidence, hashes, reports</text>

<!-- Legend -->
<rect x="40" y="388" width="10" height="10" rx="2" fill="var(--scan-fill)" stroke="var(--scan-stroke)" stroke-width="0.5"/>
<text class="small" x="56" y="397" fill="var(--text-secondary)">deterministic validation</text>
<rect x="190" y="388" width="10" height="10" rx="2" fill="var(--ai-fill)" stroke="var(--ai-stroke)" stroke-width="0.5"/>
<text class="small" x="206" y="397" fill="var(--text-secondary)">bounded AI reasoning</text>
<rect x="344" y="388" width="10" height="10" rx="2" fill="var(--fix-fill)" stroke="var(--fix-stroke)" stroke-width="0.5"/>
<text class="small" x="360" y="397" fill="var(--text-secondary)">remediation workflow</text>

</svg>
