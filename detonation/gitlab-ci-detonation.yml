# .gitlab-ci.yml (append to existing, or use standalone)
#
# REACHABLE Supply Chain Detonation — GitLab CI
#
# Scans dependencies and detonates suspicious packages in a remote
# Firecracker sandbox.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   REACHABLE_SANDBOX_HOST  — IP or DNS of the Firecracker detonation host
#   REACHABLE_SANDBOX_KEY   — Contents of the Ed25519 private key (type: File or Variable)
#
# Optional variables:
#   REACHABLE_API_KEY       — API key for REACHABLE Cloud dashboard upload
#   GROQ_API_KEY            — AI taint analysis

stages:
  - test

reachable-detonation:
  stage: test
  image: python:3.12-slim
  variables:
    REACHABLE_SANDBOX_SSH: $REACHABLE_SANDBOX_HOST
    REACHABLE_SANDBOX_SSH_KEY: /tmp/sandbox_key
  before_script:
    # Install REACHABLE
    - curl -fsSL https://raw.githubusercontent.com/sthenos-security/reach-dist/main/install.sh | bash
    - export PATH="$HOME/.reachable/venv/bin:$PATH"
    # Install SSH client
    - apt-get update -qq && apt-get install -y -qq openssh-client > /dev/null
    # Configure remote sandbox
    - mkdir -p ~/.reachable ~/.ssh
    - echo "$REACHABLE_SANDBOX_KEY" > /tmp/sandbox_key
    - chmod 600 /tmp/sandbox_key
    - ssh-keyscan -t ed25519 $REACHABLE_SANDBOX_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      reachctl scan . \
        --sandbox-mode remote \
        --ci \
        --fail-on high \
        --format sarif \
        --output gl-sast-report.json
  after_script:
    # Upload to REACHABLE Cloud (if API key set)
    - export PATH="$HOME/.reachable/venv/bin:$PATH"
    - reachctl publish --upload 2>/dev/null || true
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - ~/.reachable/scans/*/dashboard/
    when: always
    expire_in: 30 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
