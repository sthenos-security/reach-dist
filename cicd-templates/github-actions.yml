# REACHABLE Universal Security Scan — GitHub Actions
#
# One job. One command. Works on GitHub-managed AND self-hosted runners.
# REACHABLE runs all scanners concurrently in a single process — no multi-VM
# coordination, no shared volumes, no artifact passing between jobs.
#
# Typical runtime: 60–90s on a 2-core managed runner.
#
# ── Repo variables (all optional) ────────────────────────────────────
#   REACHABLE_DIST_REPO  — dist repo  (default: sthenos-security/reach-dist)
#   REACHABLE_VERSION    — pin version (default: latest)
#   FAIL_THRESHOLD       — critical | high | medium | any | none  (default: high)
#   RUNNER_LABEL         — self-hosted runner label  (default: ubuntu-latest)
#
# ── Exit codes ────────────────────────────────────────────────────────
#   0 = clean, 2 = findings above threshold, 1 = scan error

name: REACHABLE Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  REACHABLE_DIST_REPO: ${{ vars.REACHABLE_DIST_REPO || 'sthenos-security/reach-dist' }}
  REACHABLE_VERSION:   ${{ vars.REACHABLE_VERSION   || '' }}
  FAIL_THRESHOLD:      ${{ vars.FAIL_THRESHOLD      || 'high' }}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: REACHABLE Security Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install REACHABLE
        run: |
          ARGS=()
          [[ -n "$REACHABLE_VERSION" ]] && ARGS=(--version "$REACHABLE_VERSION")
          curl -fsSL "https://raw.githubusercontent.com/${REACHABLE_DIST_REPO}/main/install.sh" | bash -s -- "${ARGS[@]}"
          reachctl version

      - name: Scan
        run: reachctl scan . --ci --fail-on "$FAIL_THRESHOLD" --sarif reachable.sarif

      - name: Upload Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachable-dashboard
          path: ~/.reachable/scans/**/dashboard/
          retention-days: 30

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reachable.sarif
        continue-on-error: true
