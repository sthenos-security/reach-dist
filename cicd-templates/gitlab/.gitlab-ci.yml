# REACHABLE Universal Security Scan — GitLab CI
#
# Single job — no shared volumes, no multi-runner coordination.
# REACHABLE runs all scanners concurrently inside one process on one runner.
#
# Works on: GitLab SaaS (managed runners) AND self-hosted runners.
# Typical runtime: 60–90 seconds.
#
# ── Variables ─────────────────────────────────────────────────────────
# Set in: Project → Settings → CI/CD → Variables
#
#   REACHABLE_DIST_REPO  — dist repo  (default: sthenos-security/reach-dist)
#   REACHABLE_VERSION    — pin version (default: latest)
#   FAIL_THRESHOLD       — critical | high | medium | any | none  (default: high)
#
# ── Self-hosted runners ───────────────────────────────────────────────
# Uncomment the tags block under 'default' and set RUNNER_TAG to match
# your runner label. No other changes needed.
#
# ── Exit codes ────────────────────────────────────────────────────────
#   0 = clean, 2 = findings above threshold, 1 = scan error

variables:
  REACHABLE_DIST_REPO: "sthenos-security/reach-dist"
  REACHABLE_VERSION: ""
  FAIL_THRESHOLD: "high"
  PYTHON_VERSION: "3.11"

stages:
  - scan
  - finalize

default:
  image: python:${PYTHON_VERSION}-slim

  # Self-hosted runners: uncomment and set RUNNER_TAG variable
  # tags:
  #   - $RUNNER_TAG

  before_script:
    - apt-get update -qq && apt-get install -qq -y curl git 2>/dev/null | tail -1
    - |
      ARGS=""
      [ -n "${REACHABLE_VERSION}" ] && ARGS="--version ${REACHABLE_VERSION}"
      if ! curl -fsSL "https://raw.githubusercontent.com/${REACHABLE_DIST_REPO}/main/install.sh" | bash -s -- $ARGS; then
        echo "ERROR: install.sh failed — check REACHABLE_DIST_REPO and REACHABLE_VERSION"
        exit 1
      fi
      command -v reachctl >/dev/null 2>&1 || { echo "ERROR: reachctl not found after install"; exit 1; }
      reachctl version

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ── Scan: init + all analyzers concurrent ────────────────────────────
reachable-scan:
  stage: scan
  script:
    - |
      RAW=$(reachctl pipeline init "${CI_PROJECT_DIR}" --json 2>&1)
      JSON=$(echo "$RAW" | grep '^{' | tail -1)
      if [ -z "$JSON" ]; then
        echo "ERROR: No JSON from pipeline init. Output: $RAW"
        exit 1
      fi
      SESSION_DIR=$(echo "$JSON" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    v = d['session_dir']
    if not v: raise ValueError('session_dir empty')
    print(v)
except Exception as e:
    sys.stderr.write(str(e) + '\n'); sys.exit(1)
") || { echo "ERROR: Failed to parse session_dir"; exit 1; }
      echo "SESSION_DIR=${SESSION_DIR}" > .reachable-session
      echo "Session: ${SESSION_DIR}"
    - source .reachable-session
    - reachctl pipeline step scan --session "$SESSION_DIR"
    - reachctl pipeline step secrets malware health iac ai dlp --session "$SESSION_DIR"
  artifacts:
    paths:
      - .reachable-session
    expire_in: 1 hour

# ── Finalize: reachability analysis + dashboard + threshold gate ──────
reachable-finalize:
  stage: finalize
  needs: [reachable-scan]
  allow_failure:
    exit_codes: 2
  script:
    - source .reachable-session
    - |
      set +e
      reachctl pipeline finalize --session "$SESSION_DIR" --fail-on "$FAIL_THRESHOLD"
      FINALIZE_EXIT=$?
      mkdir -p build
      find ~/.reachable/scans -type d -name dashboard \
        -exec cp -r {}/ build/dashboard/ \; 2>/dev/null || true
      find ~/.reachable/scans -name "reachable.sarif" \
        -exec cp {} build/reachable.sarif \; 2>/dev/null || true
      exit $FINALIZE_EXIT
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/dashboard/
      - build/reachable.sarif
    reports:
      sast: build/reachable.sarif
