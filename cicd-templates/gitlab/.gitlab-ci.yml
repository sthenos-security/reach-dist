# REACHABLE Universal Security Scan — GitLab CI
#
# Single job — no shared volumes, no multi-runner coordination.
# REACHABLE runs all scanners concurrently in one process on one runner.
#
# Works on: GitLab SaaS (managed runners) AND self-hosted runners.
# Typical runtime: 60–90 seconds.
#
# ── Variables ─────────────────────────────────────────────────────────
# Set in: Project → Settings → CI/CD → Variables
#
#   REACHABLE_DIST_REPO  — dist repo  (default: sthenos-security/reach-dist)
#   REACHABLE_VERSION    — pin version (default: latest)
#   FAIL_THRESHOLD       — critical | high | medium | any | none  (default: high)
#
# ── Self-hosted runners ───────────────────────────────────────────────
# Uncomment the tags block under 'default' and set RUNNER_TAG to match
# your runner label. No other changes needed.
#
# ── Exit codes ────────────────────────────────────────────────────────
#   0 = clean, 2 = findings above threshold, 1 = scan error

variables:
  REACHABLE_DIST_REPO: "sthenos-security/reach-dist"
  REACHABLE_VERSION: ""
  FAIL_THRESHOLD: "high"
  PYTHON_VERSION: "3.11"

stages:
  - scan

default:
  image: python:${PYTHON_VERSION}-slim

  # Self-hosted runners: uncomment and set RUNNER_TAG variable
  # tags:
  #   - $RUNNER_TAG

  before_script:
    - apt-get update -qq && apt-get install -qq -y curl git 2>/dev/null | tail -1
    - |
      ARGS=""
      [ -n "${REACHABLE_VERSION}" ] && ARGS="--version ${REACHABLE_VERSION}"
      if ! curl -fsSL "https://raw.githubusercontent.com/${REACHABLE_DIST_REPO}/main/install.sh" | bash -s -- $ARGS; then
        echo "ERROR: install.sh failed — check REACHABLE_DIST_REPO and REACHABLE_VERSION"
        exit 1
      fi
      reachctl version

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

reachable:
  stage: scan
  allow_failure:
    exit_codes: 2
  script:
    - reachctl scan . --ci --fail-on "$FAIL_THRESHOLD" --sarif reachable.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ~/.reachable/scans/**/dashboard/
      - reachable.sarif
    reports:
      sast: reachable.sarif
