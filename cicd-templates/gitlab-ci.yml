# REACHABLE Universal Security Scan — GitLab CI
#
# Single job — no shared volumes, no multi-runner coordination.
# REACHABLE runs all scanners concurrently in one process on one runner.
#
# Works on: GitLab SaaS (managed runners) AND self-hosted runners.
# Typical runtime: 60–90 seconds.
#
# ── Variables ─────────────────────────────────────────────────────────
# Set in: Project → Settings → CI/CD → Variables
#
#   REACHABLE_DIST_REPO  — dist repo  (default: sthenos-security/reach-dist)
#   REACHABLE_VERSION    — pin version (default: latest)
#   FAIL_THRESHOLD       — critical | high | medium | any | none  (default: high)
#
# ── Self-hosted runners ───────────────────────────────────────────────
# Uncomment the tags block under the job and set RUNNER_TAG to match
# your runner label. No other changes needed.
#
# ── Exit codes ────────────────────────────────────────────────────────
#   0 = clean, 2 = findings above threshold, 1 = scan error

variables:
  PYTHON_VERSION: "3.11"
  REACHABLE_DIST_REPO: "sthenos-security/reach-dist"
  REACHABLE_VERSION: ""
  FAIL_THRESHOLD: "high"

stages:
  - scan

default:
  image: python:${PYTHON_VERSION}-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

reachable:
  stage: scan
  allow_failure:
    exit_codes: 2

  # Self-hosted runners: uncomment and set RUNNER_TAG variable
  # tags:
  #   - $RUNNER_TAG

  before_script:
    - apt-get update -qq
    - apt-get install -y curl git jq

    - |
      ARGS=""
      if [ -n "${REACHABLE_VERSION}" ]; then
        ARGS="--version ${REACHABLE_VERSION}"
      fi

      echo "Installing REACHABLE..."
      curl -fsSL "https://raw.githubusercontent.com/${REACHABLE_DIST_REPO}/main/install.sh" \
        | bash -s -- $ARGS

      # Add reachable CLI to PATH
      export PATH="$HOME/.reachable/venv/bin:$PATH"

      echo "REACHABLE version:"
      reachctl version

  script:
    # Re-export PATH — before_script exports don't always survive to script
    - export PATH="$HOME/.reachable/venv/bin:$PATH"
    - reachctl scan . --ci --fail-on "$FAIL_THRESHOLD" --sarif reachable.sarif

    # Print quick summary in CI logs
    - |
      echo ""
      echo "REACHABLE Findings Summary:"
      jq '.runs[].results | length' reachable.sarif 2>/dev/null || echo "0"

  artifacts:
    when: always
    expire_in: 30 days

    paths:
      - reachable.sarif

    reports:
      sast: reachable.sarif
